name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local checks
        run: bash scripts/check.sh
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start disposable stack
        run: docker compose -p sisacao-ci-${{ github.run_id }} up -d --build
      - name: HTTP end-to-end and persistence
        run: |
          python3 scripts/smoke.py
          docker compose -p sisacao-ci-${{ github.run_id }} restart backend
          python3 scripts/smoke.py --verify-persistence
      - name: Browser setup
        working-directory: frontend
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Desktop and mobile
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
      - name: Logs
        if: failure()
        run: docker compose -p sisacao-ci-${{ github.run_id }} logs --no-color --tail=100
      - name: Cleanup
        if: always()
        run: docker compose -p sisacao-ci-${{ github.run_id }} down --volumes --remove-orphans
