server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 105s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
